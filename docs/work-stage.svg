<svg viewBox="0 0 1200 1120" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>CSD 工作阶段流程</title>
<desc>训练完成后：古早端与现代端平行处理，连接矩阵为枢纽，靠拓扑剪枝汇合，再靠图像比对收窄到三个候选。</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="1200" height="1120" fill="#FFFFFF"/>

<text x="600" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="600" fill="#1A1A1A">工作阶段 · 两端往中间搭</text>
<text x="600" y="96" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#666666">训练完成后的理想流程 · 连接矩阵是枢纽，一端连拓扑剪枝，一端连仿古渲染</text>

<rect x="60" y="140" width="500" height="52" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
<text x="310" y="166" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="600" fill="#633806">古早端 · 古早图片</text>
<path d="M310 192 L310 222" fill="none" stroke="#BA7517" stroke-width="2" marker-end="url(#arr)"/>

<rect x="60" y="224" width="500" height="70" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="310" y="248" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#633806">清洗</text>
<text x="310" y="274" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#854F0B">切图 · 去噪 · 判可读性</text>
<path d="M310 294 L310 324" fill="none" stroke="#BA7517" stroke-width="2" marker-end="url(#arr)"/>

<rect x="60" y="326" width="500" height="86" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
<text x="310" y="354" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#633806">提取拓扑指标</text>
<text x="310" y="384" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#854F0B">有环 / 无环 · 杂原子 · 粗特征</text>

<rect x="640" y="140" width="500" height="52" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text x="890" y="166" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="600" fill="#0C447C">现代端 · 数据库候选池</text>
<path d="M890 192 L890 222" fill="none" stroke="#185FA5" stroke-width="2" marker-end="url(#arr)"/>

<rect x="640" y="224" width="500" height="70" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="890" y="248" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#0C447C">取 SMILES</text>
<text x="890" y="274" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#185FA5">按索引取，不下载全库；数据库若直给连接矩阵则合并</text>
<path d="M890 294 L890 324" fill="none" stroke="#185FA5" stroke-width="2" marker-end="url(#arr)"/>

<rect x="640" y="326" width="500" height="86" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
<text x="890" y="354" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="600" fill="#3C3489">连接矩阵 · 枢纽</text>
<text x="890" y="384" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#534AB7">图的关系表示 · 从这里生拓扑，也从这里渲染</text>
<path d="M890 412 L890 442" fill="none" stroke="#534AB7" stroke-width="2" marker-end="url(#arr)"/>

<rect x="640" y="444" width="500" height="70" rx="12" fill="#F5F3FF" stroke="#7F77DD" stroke-width="1"/>
<text x="890" y="468" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="600" fill="#3C3489">由连接矩阵算拓扑指标</text>
<text x="890" y="494" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#7F77DD">与古早端同构，可比</text>

<path d="M310 412 L310 560 L430 560" fill="none" stroke="#BA7517" stroke-width="2" marker-end="url(#arr)"/>
<path d="M640 479 L600 479 L600 560 L770 560" fill="none" stroke="#534AB7" stroke-width="2" marker-end="url(#arr)"/>

<rect x="200" y="510" width="800" height="100" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="600" y="542" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="600" fill="#444441">第一轮 · 拓扑剪枝</text>
<text x="600" y="574" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#5F5E5A">拓扑指标当查询条件：有没有环、有没有杂原子 → 剪掉大量不符分子</text>
<text x="600" y="598" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#993556">要量：数据库总分子数 · 召回率 · 压缩率</text>

<path d="M600 610 L600 642" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#arr)"/>
<rect x="380" y="644" width="440" height="52" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="600" y="670" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#444441">剩下少量候选分子</text>

<path d="M1140 369 L1170 369 L1170 728 L980 728" fill="none" stroke="#534AB7" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="1160" y="560" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#534AB7" transform="rotate(90 1160 560)">连接矩阵 → 渲染</text>

<path d="M600 696 L600 720" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#arr)"/>
<rect x="260" y="722" width="720" height="86" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="620" y="752" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="600" fill="#3C3489">由连接矩阵按风格渲染成结构式图片</text>
<text x="620" y="784" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#534AB7">知道年代就选对应档；档位数量待数据进来定 · 风格如何确定属训练阶段</text>

<path d="M600 808 L600 838" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#arr)"/>
<rect x="360" y="840" width="480" height="60" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="600" y="870" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="600" fill="#085041">古早图片 ↔ 候选图片 比对</text>

<path d="M600 900 L600 930" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#arr)"/>
<rect x="440" y="932" width="320" height="56" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="600" y="960" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="600" fill="#085041">出 3 个结果</text>

<path d="M600 988 L600 1014" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#arr)"/>
<rect x="380" y="1016" width="440" height="56" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="600" y="1044" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#444441">人：接受一个 · 或都不对（重画）</text>
</svg>
